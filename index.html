<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacobi Glenn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* CRT overlays (off until Initialize) */
    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s;
    }
    body.crt-on .crt-overlay { opacity: 1; }
    .scanlines {
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 1px,
        rgba(0,0,0,0.15) 1px,
        rgba(0,0,0,0.15) 2px
      );
    }
    .crt-flicker {
      background: #000;
      opacity: 0;
      animation: crt-flicker 0.08s infinite;
    }
    @keyframes crt-flicker {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.02; }
    }
    .crt-vignette {
      background: radial-gradient(
        ellipse at center,
        transparent 50%,
        rgba(0,0,0,0.4) 100%
      );
    }
    body.crt-pulse {
      animation: crt-brightness 2.5s ease-in-out infinite;
    }
    @keyframes crt-brightness {
      0%, 100% { filter: brightness(0.98); }
      50% { filter: brightness(1.02); }
    }

    /* Four-box layout */
    #terminal-phase {
      position: fixed;
      inset: 0;
      z-index: 1;
      padding: 20px;
      background: #000;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr 0.5fr 1.2fr; /* bottom right cut ~~~~~~ */
      grid-template-areas:
        "main globe"
        "main log"
        "main guide";
      gap: 0;
    }

    .panel {
      border: 1px solid #555;
      background: #050505;
      color: #666;
      padding: 1rem;
      overflow: hidden;
      opacity: 0.55;
      transition: border-color 0.4s, color 0.4s, opacity 0.4s, box-shadow 0.4s;
    }
    .panel.active {
      border-color: #fff;
      color: #fff;
      opacity: 1;
      text-shadow: 0 0 4px rgba(255,255,255,0.4);
    }

    .panel-terminal {
      grid-area: main;
      grid-row: 1 / span 3;
      display: flex;
      flex-direction: column;
      animation: terminal-pulse 2.5s ease-in-out infinite;
    }
    .panel-terminal.active {
      box-shadow: inset 0 0 60px rgba(255,255,255,0.05);
    }
    @keyframes terminal-pulse {
      0%, 100% { filter: brightness(0.96); }
      50% { filter: brightness(1); }
    }

    .panel-globe {
      grid-area: globe;
      position: relative;
      padding: 0; /* let ASCII touch the panel border */
      line-height: 1.0;
      color: #555;
      overflow: hidden;
    }
    .panel-globe.active { color: #fff; }

    #head-art {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      white-space: pre;
      transform-origin: top left;
    }

    .panel-log {
      grid-area: log;
      font-size: 10px;
      line-height: 1.35;
    }

    .panel-guide {
      grid-area: guide;
      font-size: 10px;
      line-height: 1.4;
    }
    .guide-header {
      font-weight: bold;
      letter-spacing: 0.18em;
      font-size: 9px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .guide-body { opacity: 0.9; }

    .term-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .term-output {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 13px;
      word-break: break-all;
    }
    .term-prompt-line {
      display: flex;
      align-items: center;
      margin-top: auto;
      flex-shrink: 0;
    }
    .term-prompt { margin-right: 0.25em; }
    .term-input-wrap { display: flex; align-items: center; flex: 1; min-width: 0; }
    .panel input.term-input {
      flex: 0 0 auto;
      width: auto;
      background: transparent;
      border: none;
      color: inherit;
      padding: 0;
      margin: 0;
      font-family: inherit;
      font-size: inherit;
      caret-color: #fff;
      min-width: 1ch;
    }
    .panel input.term-input:focus { outline: none; }

    /* Later screens reused from earlier flow */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #000;
      z-index: 50;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 0; }
    .loading-bar-wrap { width: 260px; height: 5px; background: #222; overflow: hidden; }
    .loading-bar { height: 100%; width: 0; background: #fff; transition: width 0.5s ease; }
    #main-screen { flex-direction: column; align-items: stretch; background: #fff; color: #111; }
    #main-screen .nav { display: flex; gap: 1.5rem; padding: 1rem 2rem; background: #000; color: #fff; }
    #main-screen .nav a { color: #fff; text-decoration: none; }
    #main-screen .nav a:hover { text-decoration: underline; }
    #main-screen .content { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; }
    #main-screen .content h1 { font-family: Georgia, serif; font-size: 2.5rem; font-weight: 400; color: #111; }
  </style>
</head>
<body>
  <div class="crt-overlay scanlines"></div>
  <div class="crt-overlay crt-flicker"></div>
  <div class="crt-overlay crt-vignette"></div>

  <div id="terminal-phase">
    <div class="panel panel-terminal active">
      <div class="term-content">
        <div class="term-output" id="term-output"></div>
        <div class="term-prompt-line" id="term-prompt-line">
          <span class="term-prompt" id="term-prompt"></span>
          <span class="term-input-wrap">
            <input type="text" class="term-input" id="term-input" autocomplete="off" spellcheck="false">
          </span>
        </div>
      </div>
    </div>
    <div class="panel panel-globe" id="globe-panel">
      <pre id="head-art"></pre>
    </div>
    <div class="panel panel-log" id="bottom-panel">
      <div id="bottom-log"></div>
    </div>
    <div class="panel panel-guide" id="guide-panel">
      <div class="guide-header">GUIDEBOOK</div>
      <div class="guide-body" id="guide-body">
        Type <span style="color:#ccc">Initialize</span> to activate the terminal.
      </div>
    </div>
  </div>

  <!-- Loading / guest / welcome / main screens (unchanged behavior) -->
  <div id="loading-screen" class="screen hidden">
    <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  </div>
  <div id="guest-screen" class="screen hidden">
    <div>You are guest number<span class="dots"></span><span class="number"></span></div>
  </div>
  <div id="welcome-screen" class="screen hidden"><h1 id="welcome-name"></h1></div>
  <div id="main-screen" class="screen hidden">
    <nav class="nav">
      <a href="#" data-page="home">Home</a>
      <a href="#" data-page="page1">Page1</a>
      <a href="#" data-page="page2">Page2</a>
      <a href="#" data-page="page3">Page3</a>
      <a href="#" data-page="page4">Page4</a>
      <a href="#" data-page="about">About</a>
    </nav>
    <main class="content"><h1 id="page-title">Home</h1></main>
  </div>

  <script>
    // ---- HEAD: high-res ASCII frame with fake spin ----
    const HEAD_ASCII_RAW = `

                                    @%@#@@#@#@##########@############=

    const HEAD_ASCII_BASE = HEAD_ASCII_RAW
      .split('\n')
      // drop completely empty lines
      .filter(line => line.trim().length > 0);

    let globePhase = 0;

    function resizeGlobeFont() {
      const panel = document.getElementById('globe-panel');
      if (!panel) return;
      const pre = document.getElementById('head-art');
      if (!pre) return;

      // Start from a fixed base font so we can measure the raw ASCII block.
      pre.style.fontSize = '8px';
      pre.style.lineHeight = '1.0';
      pre.style.transform = 'none';

      requestAnimationFrame(() => {
        const panelWidth = panel.clientWidth || panel.offsetWidth;
        const panelHeight = panel.clientHeight || panel.offsetHeight;
        const w = pre.scrollWidth;
        const h = pre.scrollHeight;
        if (!panelWidth || !panelHeight || !w || !h) return;

        // Non-uniformly scale the rendered block so it exactly fills the panel.
        const scaleX = panelWidth / w;
        const scaleY = panelHeight / h;
        pre.style.transform = 'scale(' + scaleX + ',' + scaleY + ')';
      });
    }
    function renderGlobe() {
      const el = document.getElementById('head-art');
      if (!el) return;
      const lines = HEAD_ASCII_BASE;
      if (!lines.length) return;
      // apply same left/right trim so rendered art matches sizing
      const indents = lines
        .filter(l => l.trim().length > 0)
        .map(l => (l.match(/^ */) || [''])[0].length);
      const minIndent = indents.length ? Math.min(...indents) : 0;
      const leftTrimmed = lines.map(l => l.slice(minIndent));
      let rightMost = 0;
      for (const line of leftTrimmed) {
        const coreLen = line.replace(/\s+$/g, '').length;
        if (coreLen > rightMost) rightMost = coreLen;
      }
      const trimmed = leftTrimmed.map(l => l.slice(0, rightMost));
      const width = rightMost;
      const h = trimmed.length;
      const mid = (h - 1) / 2;
      let out = '';
      for (let row = 0; row < h; row++) {
        const line = trimmed[row].padEnd(width, ' ');
        const y = (row - mid) / mid; // -1 (bottom) .. +1 (top)
        const lat = y * (Math.PI / 2); // approximate latitude
        const bandFactor = Math.cos(lat); // 1 at equator, 0 at poles
        const bandShift = Math.floor(globePhase * bandFactor) % width;
        const rotated =
          bandShift >= 0
            ? line.slice(bandShift) + line.slice(0, bandShift)
            : line;
        out += rotated + (row < h - 1 ? '\n' : '');
      }
      el.textContent = out;
    }

    let globeYaw = 0; // kept for minimal changes, but unused for now
    let globeSpinning = false;
    function startGlobeSpin() {
      function frame() {
        if (globeSpinning) {
          globePhase += 0.12;
        }
        renderGlobe();
        requestAnimationFrame(frame);
      }
      resizeGlobeFont();
      renderGlobe();
      requestAnimationFrame(frame);
    }
    // ---- END GLOBE ----

    // Guest counter (reused)
    const GUEST_KEY = 'jacobiglenn_guest';
    function getGuestNumber() {
      let n = parseInt(localStorage.getItem(GUEST_KEY) || '0', 10);
      n++; localStorage.setItem(GUEST_KEY, String(n));
      return n;
    }

    const PAGE_TITLES = { home: 'Home', page1: 'Page 1', page2: 'Page 2', page3: 'Page 3', page4: 'Page 4', about: 'About' };

    const termOutput = document.getElementById('term-output');
    const termInput = document.getElementById('term-input');
    const termPromptEl = document.getElementById('term-prompt');
    const globePanel = document.getElementById('globe-panel');
    const bottomPanel = document.getElementById('bottom-panel');
    const bottomLog = document.getElementById('bottom-log');
    const guidePanel = document.getElementById('guide-panel');

    const PROMPT = 'PS C://Users/Unknown $';
    termPromptEl.textContent = PROMPT + ' ';

    let started = false;
    let introShown = true;
    termOutput.textContent = 'Type "Initialize" to activate.';

    function runStartup() {
      started = true;
      document.body.classList.add('crt-on', 'crt-pulse');
      document.querySelector('.panel-terminal').classList.add('active');

      // Head / side panels: blink + staged power-on
      setTimeout(() => {
        // first blink ON (no head yet)
        globePanel.classList.add('active');
      }, 150);
      setTimeout(() => {
        // blink OFF
        globePanel.classList.remove('active');
      }, 450);
      setTimeout(() => {
        // second blink ON: head appears (static), spin not started yet
        globePanel.classList.add('active');
        globeSpinning = false;
        startGlobeSpin();
      }, 800);
      setTimeout(() => {
        // start spinning after blinks complete
        globeSpinning = true;
      }, 1200);
      // middle-right (log) quick blink, then stay on
      setTimeout(() => {
        bottomPanel.classList.add('active');
      }, 300); // blink ON shortly after top-right first blink
      setTimeout(() => {
        bottomPanel.classList.remove('active');
      }, 650); // blink OFF
      setTimeout(() => {
        bottomPanel.classList.add('active');
        startBottomActivity();
      }, 1300); // log panel turns on for good ~0.5s after head starts spinning
      // bottom-right (guidebook) comes on ~1s after middle-right is solid
      setTimeout(() => {
        guidePanel.classList.add('active');
      }, 2300);
      startGlobeSpin();

      const lines = ['\n(Welcome Protocol....)', '', '(Loading...)', '', '(Enter your name:)'];
      let lineIdx = 0, charIdx = 0;

      function typeNext() {
        if (lineIdx >= lines.length) {
          termOutput.textContent += '\n\nEnter your name: ';
          termInput.disabled = false;
          termInput.placeholder = '';
          termInput.focus();
          termInput.dataset.mode = 'name';
          return;
        }
        const line = lines[lineIdx];
        if (charIdx < line.length) {
          termOutput.textContent += line[charIdx++];
          setTimeout(typeNext, 40 + Math.random() * 20);
        } else {
          termOutput.textContent += '\n';
          lineIdx++;
          charIdx = 0;
          setTimeout(typeNext, 180);
        }
      }
      typeNext();
    }

    termInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const raw = termInput.value.trim();
        const cmd = raw.toLowerCase();

        if (introShown) {
          termOutput.textContent = '';
          introShown = false;
        }

        if (termInput.dataset.mode === 'name') {
          const name = raw || 'Guest';
          termOutput.textContent += (termOutput.textContent ? '\n' : '') + PROMPT + ' ' + (raw || '') + '\n';
          termInput.disabled = true;
          termInput.value = '';
          termInput.removeAttribute('data-mode');
          document.getElementById('terminal-phase').style.display = 'none';
          document.getElementById('loading-screen').classList.remove('hidden');
          document.getElementById('loading-bar').style.width = '100%';
          setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            showGuest(name);
          }, 600);
          return;
        }

        termOutput.textContent += (termOutput.textContent ? '\n' : '') + PROMPT + ' ' + raw + '\n';
        termInput.value = '';
        if (!started) {
          if (cmd === 'initialize' || cmd === 'i') {
            termInput.disabled = true;
            runStartup();
          } else if (raw) {
            termOutput.textContent += '\nUnknown command';
          }
        }
      }
    });

    termInput.placeholder = ' ';
    termInput.focus();

    window.addEventListener('resize', resizeGlobeFont);
    // initial sizing once layout is ready
    window.setTimeout(resizeGlobeFont, 0);

    function startBottomActivity() {
      const msgs = ['[SYS] Protocol initialized', '[NET] Connection: LOCAL', '[AUTH] Awaiting input', '[SYSTEM] Ready', '[CORE] Memory allocation complete', '[BOOT] Kernel loaded successfully', '[NET] Handshake established', '[AUTH] Token validated', '[SEC] Firewall active', '[CORE] Process queue initialized', '[SYS] Cache cleared', '[IO] Buffer ready', '[AUTH] Session opened', '[BOOT] Services mounted', '[SYS] Entropy pool seeded', '[SEC] Certificate verified', '[CORE] Thread pool spawned', '[IO] Stream open', '[AUTH] Permissions granted', '[SYS] Watchdog armed', '[CORE] Scheduler online', '[SEC] Intrusion scan: clean', '[NET] Gateway reachable', '[BOOT] Config loaded', '[IO] Device handoff complete', '[AUTH] Identity confirmed', '[CORE] Stack trace: null', '[SEC] Vault sealed', '[BOOT] Modules indexed', '[SYS] Signal stable', '[IO] Write buffer flushed', '[SEC] Audit log initialized', '[CORE] Interrupt handler ready', '[AUTH] Credentials cached', '[SYS] ASCII head rendered via STL-to-ASCII (Andrew Sink)'];      let i = 0;
      const add = () => {
        const div = document.createElement('div');
        div.textContent = msgs[i % msgs.length] + ' [' + new Date().toLocaleTimeString() + ']';
        bottomLog.appendChild(div);
        if (bottomLog.children.length > 9) bottomLog.removeChild(bottomLog.firstChild);
        i++;
      };
      add();
      setInterval(add, 1500 + Math.random() * 1000);
    }

    function showGuest(name) {
      const gs = document.getElementById('guest-screen');
      const dotsEl = gs.querySelector('.dots');
      const numEl = gs.querySelector('.number');
      gs.classList.remove('hidden');
      dotsEl.innerHTML = '';
      numEl.textContent = '';
      [1,2,3].forEach((_, i) => setTimeout(() => { const d = document.createElement('span'); d.textContent = '.'; dotsEl.appendChild(d); }, 400 * (i + 1)));
      setTimeout(() => { numEl.textContent = ' ' + getGuestNumber(); }, 1600);
      setTimeout(() => {
        gs.classList.add('hidden');
        document.getElementById('welcome-name').textContent = `Welcome, ${name}`;
        document.getElementById('welcome-screen').classList.remove('hidden');
        setTimeout(() => {
          document.getElementById('welcome-screen').classList.add('hidden');
          document.getElementById('main-screen').classList.remove('hidden');
        }, 1500);
      }, 2500);
    }

    document.querySelectorAll('.nav a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('page-title').textContent = PAGE_TITLES[a.getAttribute('data-page')];
      });
    });
  </script>
</body>
</html>
