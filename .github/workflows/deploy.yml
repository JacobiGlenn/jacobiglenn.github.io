name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API keys
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const lines = [
            'window.YOUTUBE_API_KEY = ' + JSON.stringify(process.env.YOUTUBE_API_KEY || '') + ';',
            'window.JSONBIN_BIN_ID  = ' + JSON.stringify(process.env.JSONBIN_BIN_ID  || '') + ';',
            'window.JSONBIN_KEY     = ' + JSON.stringify(process.env.JSONBIN_KEY     || '') + ';'
          ];
          fs.writeFileSync('data/api-config.js', lines.join('\n'));
          console.log('api-config.js written');
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
