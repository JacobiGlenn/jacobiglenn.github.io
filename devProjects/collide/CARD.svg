<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1f"/>
      <stop offset="100%" style="stop-color:#13132e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- RED cursor — with drawing swirl coming off the tip -->
  <polygon points="110,145 110,190 123,177 130,193 137,190 129,173 143,170" fill="#f87171" opacity="0.9"/>
  <!-- swirl / drawing trail from red cursor tip -->
  <path d="M 110,145 C 130,120 170,115 190,135 C 215,158 200,185 230,195 C 265,207 295,185 310,205 C 330,230 305,255 330,265" stroke="#f87171" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <!-- little dot at end of trail -->
  <circle cx="332" cy="267" r="3" fill="#f87171" opacity="0.75"/>

  <!-- BLUE cursor -->
  <polygon points="420,130 420,175 433,162 440,178 447,175 439,158 453,155" fill="#60a5fa" opacity="0.9"/>

  <!-- GREEN cursor — moved to sit at the left side of the comment bubble -->
  <polygon points="555,210 555,255 568,242 575,258 582,255 574,238 588,235" fill="#34d399" opacity="0.9"/>
  <!-- comment bubble: above and to the left of the cursor -->
  <rect x="385" y="148" width="155" height="52" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <!-- tail from bottom-right corner of bubble pointing down to cursor tip -->
  <path d="M 535,200 L 554,209 L 520,200" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  <!-- text lines inside bubble -->
  <line x1="400" y1="168" x2="525" y2="168" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="183" x2="506" y2="183" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>

  <!-- YELLOW cursor -->
  <polygon points="690,135 690,180 703,167 710,183 717,180 709,163 723,160" fill="#fbbf24" opacity="0.9"/>
</svg>
