<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1f"/>
      <stop offset="100%" style="stop-color:#13132e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- subtle grid -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- RED cursor — moved down 25px -->
  <polygon points="110,170 110,215 123,202 130,218 137,215 129,198 143,195" fill="#f87171" opacity="0.9"/>
  <!-- swirl / drawing trail from red cursor tip -->
  <path d="M 110,170 C 130,145 170,140 190,160 C 215,183 200,210 230,220 C 265,232 295,210 310,230 C 330,255 305,275 330,285" stroke="#f87171" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <!-- little dot at end of trail -->
  <circle cx="332" cy="287" r="3" fill="#f87171" opacity="0.75"/>

  <!-- BLUE cursor -->
  <polygon points="420,130 420,175 433,162 440,178 447,175 439,158 453,155" fill="#60a5fa" opacity="0.9"/>

  <!-- GREEN cursor -->
  <polygon points="640,250 640,295 653,282 660,298 667,295 659,278 673,275" fill="#34d399" opacity="0.9"/>
  <!-- comment bubble: above and to the left -->
  <rect x="430" y="163" width="155" height="52" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <!-- tail from bottom-right of bubble to cursor tip -->
  <path d="M 585,215 L 640,249 L 610,216" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  <!-- text lines inside bubble -->
  <line x1="445" y1="183" x2="570" y2="183" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
  <line x1="445" y1="198" x2="551" y2="198" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>

  <!-- YELLOW cursor -->
  <polygon points="690,135 690,180 703,167 710,183 717,180 709,163 723,160" fill="#fbbf24" opacity="0.9"/>
</svg>
