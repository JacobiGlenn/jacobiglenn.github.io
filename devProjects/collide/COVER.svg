<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- background -->
  <rect width="1200" height="300" fill="#0d0d1f"/>

  <!-- LEFT: file tree panel -->
  <rect width="185" height="300" fill="#111126"/>
  <line x1="185" y1="0" x2="185" y2="300" stroke="#1e1e3a" stroke-width="1"/>
  <!-- panel title -->
  <text x="14" y="52" font-family="monospace" font-size="11" fill="#4a4a6a" letter-spacing="2">EXPLORER</text>
  <!-- folder -->
  <text x="14" y="78" font-family="monospace" font-size="12" fill="#6b7280">▾ src/</text>
  <!-- files — all red (red user's files) -->
  <text x="26" y="99"  font-family="monospace" font-size="12" fill="#f87171">  editor.ts</text>
  <text x="26" y="119" font-family="monospace" font-size="12" fill="#f87171">  session.ts</text>
  <!-- active file row highlight -->
  <rect x="0" y="124" width="185" height="20" fill="#f87171" opacity="0.12"/>
  <text x="26" y="138" font-family="monospace" font-size="12" fill="#f87171">→ conflict.ts</text>
  <text x="26" y="158" font-family="monospace" font-size="12" fill="#f87171">  sync.ts</text>
  <text x="26" y="178" font-family="monospace" font-size="12" fill="#f87171">  index.ts</text>

  <!-- LINE NUMBERS column -->
  <rect x="185" y="0" width="40" height="300" fill="#0f0f22"/>
  <line x1="225" y1="0" x2="225" y2="300" stroke="#1e1e3a" stroke-width="1"/>
  <text x="218" y="88"  font-family="monospace" font-size="11" fill="#2e2e50" text-anchor="end">1</text>
  <text x="218" y="113" font-family="monospace" font-size="11" fill="#2e2e50" text-anchor="end">2</text>
  <text x="218" y="138" font-family="monospace" font-size="11" fill="#2e2e50" text-anchor="end">3</text>
  <text x="218" y="163" font-family="monospace" font-size="11" fill="#f87171" text-anchor="end">4</text>
  <text x="218" y="188" font-family="monospace" font-size="11" fill="#2e2e50" text-anchor="end">5</text>
  <text x="218" y="213" font-family="monospace" font-size="11" fill="#2e2e50" text-anchor="end">6</text>

  <!-- CODE LINES — all red (red user wrote this) -->
  <text x="236" y="88"  font-family="monospace" font-size="13" fill="#f87171">import { Session } from './core';</text>
  <!-- line 2 empty -->
  <text x="236" y="138" font-family="monospace" font-size="13" fill="#f87171">const room = new Session({</text>
  <!-- line 4: active edit row -->
  <rect x="185" y="148" width="1015" height="22" fill="#f87171" opacity="0.07"/>
  <!-- red user name tag above cursor line -->
  <rect x="540" y="137" width="34" height="14" rx="3" fill="#f87171" opacity="0.9"/>
  <text x="557" y="148" font-family="monospace" font-size="9" fill="#0d0d1f" text-anchor="middle" dominant-baseline="central">alex</text>
  <text x="236" y="163" font-family="monospace" font-size="13" fill="#f87171">  sync: socket, cursors: true,<tspan fill="#f87171" opacity="1">|</tspan></text>
  <text x="236" y="188" font-family="monospace" font-size="13" fill="#f87171">  onConflict: resolve,</text>
  <text x="236" y="213" font-family="monospace" font-size="13" fill="#f87171">});</text>

  <!-- BLUE comment box floating near line 3 -->
  <rect x="680" y="88" width="230" height="54" rx="8" fill="#080d1c" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- tail pointing down-left -->
  <path d="M 703,142 L 695,158 L 722,142" fill="#080d1c" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="696" y="110" font-family="monospace" font-size="12" fill="#60a5fa">// refactor this later</text>
  <text x="696" y="130" font-family="monospace" font-size="11" fill="#3b6aaa" opacity="0.9">— bob, 3 min ago</text>

  <!-- BLUE cursor near comment tail -->
  <polygon points="695,162 695,193 705,182 711,196 716,193 710,181 720,178" fill="#60a5fa" opacity="0.9"/>
</svg>
