<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1f"/>
      <stop offset="100%" style="stop-color:#13132e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- grid -->
  <line x1="0" y1="133" x2="1200" y2="133" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="266" x2="1200" y2="266" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="900" y1="0" x2="900" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <!-- watermark wordmark -->
  <text x="600" y="200" font-family="'Courier New', Courier, monospace" font-size="200" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" opacity="0.04">CollIDE</text>
  <!-- multi-user cursors scattered -->
  <polygon points="180,80 180,125 193,112 200,128 207,125 199,108 213,105" fill="#f87171" opacity="0.85"/>
  <polygon points="420,55 420,100 433,87 440,103 447,100 439,83 453,80" fill="#60a5fa" opacity="0.85"/>
  <polygon points="730,70 730,115 743,102 750,118 757,115 749,98 763,95" fill="#34d399" opacity="0.85"/>
  <polygon points="970,60 970,105 983,92 990,108 997,105 989,88 1003,85" fill="#fbbf24" opacity="0.85"/>
  <!-- accent bars -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect x="0" y="397" width="1200" height="3" fill="url(#accent)"/>
  <!-- wordmark -->
  <text x="600" y="195" font-family="'Courier New', Courier, monospace" font-size="100" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="6">CollIDE</text>
  <!-- tagline -->
  <text x="600" y="268" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#818cf8" text-anchor="middle" dominant-baseline="central" letter-spacing="5" opacity="0.9">AI-POWERED COLLABORATIVE IDE FOR TEAMS</text>
</svg>
