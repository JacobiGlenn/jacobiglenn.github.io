<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1f"/>
      <stop offset="100%" style="stop-color:#13132e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <!-- grid -->
  <line x1="0" y1="166" x2="1200" y2="166" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="0" y1="333" x2="1200" y2="333" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="300" y1="0" x2="300" y2="500" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="900" y1="0" x2="900" y2="500" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <!-- cursors spread across top, well inset -->
  <polygon points="140,80 140,125 153,112 160,128 167,125 159,108 173,105" fill="#f87171" opacity="0.85"/>
  <polygon points="400,60 400,105 413,92 420,108 427,105 419,88 433,85" fill="#60a5fa" opacity="0.85"/>
  <polygon points="730,70 730,115 743,102 750,118 757,115 749,98 763,95" fill="#34d399" opacity="0.85"/>
  <polygon points="1000,65 1000,110 1013,97 1020,113 1027,110 1019,93 1033,90" fill="#fbbf24" opacity="0.85"/>
  <!-- accent bars -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect x="0" y="497" width="1200" height="3" fill="url(#accent)"/>
  <!-- wordmark — centered in the lower two-thirds -->
  <text x="600" y="290" font-family="'Courier New', Courier, monospace" font-size="100" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="6">CollIDE</text>
  <!-- tagline -->
  <text x="600" y="360" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#818cf8" text-anchor="middle" dominant-baseline="central" letter-spacing="5" opacity="0.9">AI-POWERED COLLABORATIVE IDE FOR TEAMS</text>
</svg>
