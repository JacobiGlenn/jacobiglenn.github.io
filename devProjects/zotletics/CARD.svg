<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#0d2b1a"/>
    </linearGradient>
    <linearGradient id="zgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- subtle grid lines -->
  <line x1="0" y1="166" x2="800" y2="166" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="0" y1="333" x2="800" y2="333" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="266" y1="0" x2="266" y2="500" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="500" stroke="#1a3a1a" stroke-width="1"/>
  <!-- Z lettermark -->
  <text x="400" y="310" font-family="Impact, Arial Black, sans-serif" font-size="260" font-weight="900" fill="url(#zgrad)" text-anchor="middle" opacity="0.18">Z</text>
  <!-- bold Z foreground -->
  <text x="400" y="310" font-family="Impact, Arial Black, sans-serif" font-size="200" font-weight="900" fill="url(#zgrad)" text-anchor="middle">Z</text>
  <!-- wordmark -->
  <text x="400" y="410" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="12">ZOTLETICS</text>
  <!-- tagline -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="18" fill="#4ade80" text-anchor="middle" letter-spacing="3" opacity="0.85">UCI FITNESS PLATFORM</text>
</svg>
