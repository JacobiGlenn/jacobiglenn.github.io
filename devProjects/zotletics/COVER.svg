<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#0d2b1a"/>
    </linearGradient>
    <linearGradient id="zgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- grid lines -->
  <line x1="0" y1="133" x2="1200" y2="133" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="0" y1="266" x2="1200" y2="266" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="400" stroke="#1a3a1a" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="400" stroke="#1a3a1a" stroke-width="1"/>
  <!-- giant Z watermark -->
  <text x="600" y="380" font-family="Impact, Arial Black, sans-serif" font-size="500" font-weight="900" fill="url(#zgrad)" text-anchor="middle" opacity="0.07">Z</text>
  <!-- wordmark -->
  <text x="600" y="220" font-family="Impact, Arial Black, sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="20">ZOTLETICS</text>
  <!-- tagline -->
  <text x="600" y="275" font-family="Arial, sans-serif" font-size="22" fill="#4ade80" text-anchor="middle" letter-spacing="5" opacity="0.9">UCI HOUSING FITNESS PLATFORM</text>
  <!-- award pill -->
  <rect x="450" y="300" width="300" height="38" rx="19" fill="#22c55e" opacity="0.2"/>
  <text x="600" y="324" font-family="Arial, sans-serif" font-size="15" fill="#4ade80" text-anchor="middle" letter-spacing="2"><Æ ICSSC WebJam 2025 Winner</text>
</svg>
