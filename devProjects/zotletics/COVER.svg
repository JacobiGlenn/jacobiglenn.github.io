<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="50%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="zfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- diagonal speed lines -->
  <line x1="-100" y1="0" x2="300" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.12"/>
  <line x1="100" y1="0" x2="500" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.10"/>
  <line x1="300" y1="0" x2="700" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.08"/>
  <line x1="500" y1="0" x2="900" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.08"/>
  <line x1="700" y1="0" x2="1100" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.10"/>
  <line x1="900" y1="0" x2="1300" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.12"/>
  <line x1="1100" y1="0" x2="1500" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.08"/>
  <!-- giant Z watermark -->
  <text x="600" y="380" font-family="Impact, Arial Black, sans-serif" font-size="520" font-weight="900" fill="#22c55e" text-anchor="middle" opacity="0.07">Z</text>
  <!-- accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- accent bar bottom -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accent)"/>
  <!-- wordmark -->
  <text x="600" y="182" font-family="Impact, Arial Black, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="18" dominant-baseline="central">ZOTLETICS</text>
  <!-- tagline -->
  <text x="600" y="225" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4ade80" text-anchor="middle" letter-spacing="6" dominant-baseline="central" opacity="0.9">UCI HOUSING FITNESS PLATFORM</text>
</svg>
